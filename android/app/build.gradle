apply plugin: 'com.android.application'

// Chiave di upload Play: env var (CI) prima del file locale (gitignorato), mai nel repo.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }
def kvStore   = System.getenv('KV_UPLOAD_STORE_FILE')     ?: ksProps['storeFile']
def kvStorePw = System.getenv('KV_UPLOAD_STORE_PASSWORD') ?: ksProps['storePassword']
def kvAlias   = System.getenv('KV_UPLOAD_KEY_ALIAS')      ?: ksProps['keyAlias']
def kvKeyPw   = System.getenv('KV_UPLOAD_KEY_PASSWORD')   ?: ksProps['keyPassword']

android {
    namespace = "it.kidville.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (kvStore) {
                storeFile file(kvStore); storePassword kvStorePw
                keyAlias kvAlias;        keyPassword kvKeyPw
            }
        }
    }
    defaultConfig {
        applicationId "it.kidville.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode: contatore progressivo indipendente per Android (NON agganciato al
        // build number iOS — spazi di numerazione di store diversi). Si incrementa di 1 a
        // ogni .aab caricato su Play, anche solo su Internal testing: Play non riaccetta
        // mai un versionCode già usato, nemmeno se l'upload precedente è stato eliminato.
        // 1 = bruciato il 2026-08-05 (release Alpha del canale di test chiuso, tuttora attiva).
        // 2 = la 1.0 ricostruita il 2026-08-09. 3 = la 1.1 (download in Galleria/File, 24/09/2026): la spec
        // vuole «il primo libero, da verificare su Play Console (≥ 3)» — se al caricamento
        // Play dicesse che il 3 è già usato, si alza qui e si ricostruisce, non si forza.
        // 4 = la 1.2 (caricamenti nativi in background, 03/10/2026): il primo libero SECONDO IL REPO (3 = la 1.1 pubblicata).
        // Da confermare su Play Console, in sola lettura, prima di costruire il bundle per l'invio: se Play dicesse che il 4 è già
        // usato, si alza in un branch di correzione e si ricostruisce, mai forzare.
        versionCode 4
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Nessun fallback silenzioso sulla chiave di debug: se la chiave di upload
            // manca, la build fallisce — meglio di un .aab che Play rifiuta solo dopo
            // l'upload, quando il tempo è già bruciato.
            signingConfig kvStore ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // `BuildConfig` NON si genera da solo: con AGP 8 la classe è spenta di default e `gradle.properties` non la riaccende.
    // La vogliono i caricamenti nativi (`BuildConfig.DEBUG` per la politica degli host, §9, e per `creaElementoDiProva`, solo
    // Debug; `VERSION_NAME`/`VERSION_CODE` per `versione_app` dei log) e il lock di J4, che cerca `BuildConfig.DEBUG` nei sorgenti.
    buildFeatures {
        buildConfig true
    }
}

// ─── IL CANCELLO SULLA SHELL NATIVA ────────────────────────────────────────────
// `src/main/assets/capacitor.config.json` è GITIGNORATO e lo riscrive `npx cap sync`
// con la CAP_SERVER_URL del momento — tipicamente quella di un collaudo su emulatore
// rimasta lì. Fra il 2026-07-31 e il 2026-08-14 è successo cinque volte, e il 2026-08-05
// un .aab che puntava a `10.0.2.2:3100` è stato scoperto solo quattro giorni dopo.
// Né git, né la CI, né il gate possono vederlo: quel file in un clone pulito non esiste.
// Quindi il controllo va qui, nell'unico momento in cui l'informazione c'è davvero.
//
// SOLO sul ramo di RELEASE: `assembleDebug` e l'emulatore devono continuare a puntare
// a un indirizzo di sviluppo senza che nessuno protesti. Un cancello che dà torto a chi
// lavora viene tolto entro una settimana, e allora non protegge più niente.
tasks.register('verificaShellNativa', Exec) {
    description = 'Verifica che capacitor.config.json punti alla produzione prima di una build di rilascio.'
    group = 'verification'
    workingDir = rootProject.file('..')
    commandLine 'python3', 'scripts/verifica-shell-nativa.py', '--piattaforma', 'android'
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verificaShellNativa' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Caricamenti nativi in background, API 24-33: lavoro unico `kidville-caricamenti` con servizio in primo piano `dataSync`
    // (`LavoroCaricamenti`). Da API 34 il motore è UIDT (JobScheduler) e non passa di qui. Versione fissata in variables.gradle.
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    testImplementation "junit:junit:$junitVersion"
    // `org.json` dell'SDK Android, nei test sulla JVM, è uno stub che lancia «not mocked»: la coda e il registro dei
    // caricamenti nativi (it.kidville.app.caricamenti) lo usano, quindi nei test serve l'implementazione vera. Sta PRIMA
    // di android.jar nel classpath dei test, ed è per questo che si dichiara qui. Solo test: nell'APK resta quello di sistema.
    testImplementation "org.json:json:20251224"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// `ManifestCaricamentiTest` legge il manifest FUSO della build Debug (RECEIVE_BOOT_COMPLETED, che serve a `setPersisted(true)` del job
// UIDT e arriva da WorkManager; e l'assenza dei permessi sui media che nessuna libreria deve portare). Il file lo produce
// `processDebugMainManifest`: i test ne dipendono in modo ESPLICITO, così col comando di verifica c'è sempre e il test non ha un
// ramo «saltato» (secondario n. 85). `matching` e non `named`: AGP registra i task di variante dopo la valutazione di questo file.
tasks.matching { it.name == 'testDebugUnitTest' }.configureEach { dependsOn 'processDebugMainManifest' }
