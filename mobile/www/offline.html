<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kidville</title>
    <!--
      Ripiego NATIVO (capacitor.config.ts → server.errorPath). Copre l'unico caso
      che nessun Service Worker può coprire: app appena installata, dispositivo
      offline, SW mai registrato — quindi nessuna cache da cui pescare.

      Il testo dice «non raggiungibile» e NON «sei offline» di proposito: su
      Android questa pagina scatta anche su un 4xx/5xx di main frame
      (onReceivedHttpError), cioè anche con la rete perfettamente funzionante.
      Dire una cosa falsa all'utente sarebbe un modo di nascondere un guasto.

      «Riprova» NON naviga alla cieca. Prima sonda l'host con una HEAD a timeout
      breve e va avanti solo se risponde: senza rete la navigazione fallirebbe,
      la WebView ricaricherebbe questo stesso errorPath e l'utente resterebbe
      inchiodato su un pulsante che non fa nulla e non spiega niente.

      La sonda è CROSS-ORIGIN: questa pagina vive sullo schema locale di
      Capacitor, l'app sta su un altro host e non manda header CORS. Serve
      quindi `mode: 'no-cors'`, e la risposta è per forza OPACA — `ok` false,
      `status` 0. Vale come «raggiungibile» il fatto stesso che la promise si
      risolva: un controllo su `res.ok` qui non navigherebbe MAI.

      «Riprova» RICARICA DENTRO LA WEBVIEW e non apre il browser di sistema —
      ma non è questa pagina a garantirlo, ed è bene saperlo prima di toccarla.
      Fino al 2026-08-03 il pulsante usciva davvero dall'app (rilievo T14-F2):
      questa pagina vive sullo schema locale, quindi la sua navigazione verso
      `app.kidville.it` è fuori origine, e Capacitor la manda al browser di
      sistema a meno che l'host non stia in `server.allowNavigation`
      (`capacitor.config.ts`). Senza quella riga l'utente usciva dall'app,
      perdeva la sessione nativa e finiva in Chrome — su PRODUZIONE, anche con
      una build di collaudo puntata altrove.

      Conseguenza operativa: `URL_APP` qui sotto e `server.allowNavigation` sono
      due metà della stessa decisione. Cambiarne una sola rimette il difetto, e
      per questo i due file sono tenuti insieme da un lock
      (`__tests__/architecture/riprova-offline-resta-nella-webview.test.ts`).
      Nel lock lo schema è vietato: `allowNavigation: ['https://app.kidville.it']`
      NON funzionerebbe, perché né HostMask (Android) né doesHost (iOS) tolgono
      lo schema — spezzano su `.` e confrontano i pezzi.
      L'URL resta cablato perché la pagina non ha modo di leggere `server.url`:
      su origine locale il bridge di Capacitor NON è iniettato quando l'app è
      servita da un host remoto.

      PREZZO DA SAPERE, e ancora aperto (rilievo W9): `URL_APP` è un letterale di
      PRODUZIONE, non una funzione della build. In una build di collaudo
      (`CAP_SERVER_URL` puntata all'emulatore, 10.0.2.2:3100) «Riprova» porta
      quindi su app.kidville.it DENTRO la WebView, ma senza bridge:
      `Bridge.loadWebView`
      limita `addDocumentStartJavaScript` alla sola origine configurata
      (`Bridge.java:266-274`), quindi lì `window.Capacitor` non esiste — niente
      fotocamera, push, biometria, share, badge — e l'utente resta sui dati veri
      delle famiglie senza barra degli indirizzi. Prima del 2026-08-03 finiva
      sugli stessi dati ma in Chrome, cioè con una via d'uscita.
      Non è stato chiuso qui perché richiede di cambiare il MODO di compilare
      (`cap sync` non passa da nessuno script npm né dalla CI: è digitato a mano
      in una decina di documenti), e un generatore che quelle righe non invocano
      farebbe sembrare risolto un problema che resterebbe. Chi rimette mano alla
      shell nativa lo chiuda insieme a quei documenti.

      Niente log: la pagina è su un'altra origine e per ipotesi senza rete, un
      log non arriverebbe da nessuna parte. L'esito lo racconta la UI.

      Nessuna dipendenza esterna: né font, né CSS, né JS. È il ripiego del ripiego.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: calc(32px + env(safe-area-inset-top)) 32px calc(32px + env(safe-area-inset-bottom));
        background: #006a5f;
        color: #fff;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        max-width: 22em;
        font-size: 15px;
        line-height: 1.5;
        opacity: 0.85;
      }
      button {
        margin-top: 10px;
        border: 0;
        border-radius: 999px;
        background: #fdc400;
        color: #006a5f;
        font: inherit;
        font-weight: 800;
        text-transform: uppercase;
        padding: 13px 28px;
      }
      button:active {
        transform: scale(0.96);
      }
      button[disabled] {
        opacity: 0.6;
      }
      /* Bianco pieno e non giallo: #fdc400 su #006a5f sta a 4,0:1, sotto la
         soglia AA per il testo normale. Opacità 1 per lo stesso motivo. */
      .stato {
        min-height: 1.4em;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        opacity: 1;
      }
      .en {
        display: none;
      }
      html[lang="en"] .it {
        display: none;
      }
      html[lang="en"] .en {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1 class="it">Kidville non è raggiungibile</h1>
    <h1 class="en">Kidville is unreachable</h1>
    <p class="it">Controlla la connessione e riprova.</p>
    <p class="en">Check your connection and try again.</p>
    <button class="it" type="button">Riprova</button>
    <button class="en" type="button">Try again</button>
    <p id="kv-stato" class="stato" role="status" aria-live="polite"></p>
    <script>
      (function () {
        var URL_APP = 'https://app.kidville.it/';
        // Abbastanza per una 3G stanca, abbastanza poco perché l'attesa non
        // sembri un blocco: oltre, l'utente ritocca il pulsante comunque.
        var ATTESA_MS = 6000;

        // Toglie lo splash nativo, SE il bridge di Capacitor è raggiungibile da
        // qui. In modalità aereo si arriva su questa pagina in una frazione di
        // secondo, mentre lo splash resterebbe fino al suo tetto (6 s, vedi
        // `capacitor.config.ts`): sei secondi di schermata d'avvio davanti a un
        // messaggio già pronto.
        //
        // È un TENTATIVO e non una garanzia, per la ragione scritta più su in
        // questo stesso file: su origine locale il bridge può non essere
        // iniettato quando l'app è servita da un host remoto (Android,
        // `Bridge.java:266-274`). Se `window.Capacitor` non c'è, questo blocco
        // non fa nulla e il tetto resta l'unica via d'uscita — che è il
        // comportamento che si avrebbe comunque senza queste righe.
        try {
          var ponte = window.Capacitor;
          var splash = ponte && ponte.Plugins && ponte.Plugins.SplashScreen;
          if (splash && typeof splash.hide === 'function') splash.hide({ fadeOutDuration: 250 });
        } catch (e) {
          /* nessun bridge, o plugin assente: resta il tetto del plugin. Niente
             log perché qui non c'è rete per portarlo via — vedi la nota in cima. */
        }

        // La lingua del sistema è l'unico segnale disponibile: il cookie
        // KV_LOCALE vive sull'origine remota, che qui non è raggiungibile.
        var inglese = false;
        try {
          inglese = /^en/i.test(navigator.language || '');
        } catch (e) {
          inglese = false; /* lingua non determinabile: resta l'italiano */
        }
        if (inglese) document.documentElement.lang = 'en';

        var stato = document.getElementById('kv-stato');
        var bottoni = document.querySelectorAll('button');
        var occupato = false;

        function testo(it, en) {
          return inglese ? en : it;
        }

        function abilita(si) {
          for (var i = 0; i < bottoni.length; i++) bottoni[i].disabled = !si;
        }

        function raggiungibile() {
          if (typeof fetch !== 'function') {
            // WebView senza fetch: non c'è modo di sondare. Meglio tentare la
            // navigazione che lasciare l'utente su un pulsante inerte.
            return Promise.resolve(true);
          }
          var controllo = typeof AbortController === 'function' ? new AbortController() : null;
          var scaduta = false;
          var timer = setTimeout(function () {
            scaduta = true;
            if (controllo) controllo.abort();
          }, ATTESA_MS);

          var opzioni = { method: 'HEAD', mode: 'no-cors', cache: 'no-store' };
          if (controllo) opzioni.signal = controllo.signal;

          return fetch(URL_APP, opzioni).then(
            function () {
              clearTimeout(timer);
              return !scaduta;
            },
            function () {
              clearTimeout(timer);
              return false;
            }
          );
        }

        function riprova() {
          if (occupato) return;
          occupato = true;
          abilita(false);
          stato.textContent = testo('Verifico la connessione…', 'Checking the connection…');

          raggiungibile().then(function (ok) {
            if (ok) {
              // La pagina sta per essere sostituita: i pulsanti restano
              // disabilitati di proposito, così un secondo tocco non fa
              // ripartire nulla a navigazione già avviata.
              location.href = URL_APP;
              return;
            }
            occupato = false;
            abilita(true);
            stato.textContent = testo('Ancora nessuna connessione.', 'Still no connection.');
          });
        }

        for (var b = 0; b < bottoni.length; b++) {
          bottoni[b].addEventListener('click', riprova);
        }
      })();
    </script>
  </body>
</html>
