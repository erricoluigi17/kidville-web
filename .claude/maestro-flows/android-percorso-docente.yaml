# =============================================================================
# Kidville · ANDROID — percorso utente reale del DOCENTE
#   login → dashboard → appello (presenze) → bacheca (comunicazioni) → Indietro
#
# Prerequisiti: vedi .claude/maestro-flows/README.md
#   - server host :3000 via `npx next start` (build di produzione, NON next dev:
#     l'HMR-websocket non idrata la WebView via il bridge 10.0.2.2)
#   - APK con CAP_SERVER_URL="http://10.0.2.2:3000"
#   - env MAESTRO_KV_EMAIL_DOCENTE / MAESTRO_KV_PASSWORD ESPORTATE
#
# Esecuzione:
#   export MAESTRO_KV_EMAIL_DOCENTE=... MAESTRO_KV_PASSWORD=...
#   maestro test .claude/maestro-flows/android-percorso-docente.yaml
#
# Selettori RI-MISURATI sull'albero di accessibilità il 2026-07-31/08-01
# (emulatore KV-play-phone, Android 16, `adb shell uiautomator dump`).
# =============================================================================
appId: it.kidville.app
name: Kidville · Android — percorso docente
tags:
  - android
  - docente
env:
  KV_EMAIL: ${MAESTRO_KV_EMAIL_DOCENTE}
  KV_PASSWORD: ${MAESTRO_KV_PASSWORD}
---
- launchApp:
    clearState: true

# ── 1. LOGIN ─────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Accedi al tuo account Kidville"
    timeout: 60000

# ⚠️ QUESTA ASSERZIONE NON È DECORATIVA: È IL RESPIRO CHE SERVE ALL'IDRATAZIONE.
# Misurato il 2026-08-02, emulatore KV-play-phone / API 36. Senza di essa il flow
# digitava troppo presto, React idratava DOPO e svuotava i campi: `tapOn: "Accedi"`
# risultava COMPLETED, il form non partiva, e sullo schermo restava il messaggio
# nativo del browser «Please fill out this field». Il flow moriva due passi dopo,
# sull'asserzione «Dashboard» — facendo sembrare che la dashboard non ci fosse.
# Due esecuzioni su due.
#
# Il gemello del GENITORE non aveva il difetto per un motivo ACCIDENTALE: fra
# l'attesa e la prima digitazione ha un `assertVisible` e un `takeScreenshot`, cioè
# due comandi che fanno passare il tempo senza che nessuno li avesse messi lì per
# quello. Il flow docente era l'unico dei due a digitare subito — ed è l'unico che
# è caduto. Chi toglie questa riga perché «tanto la pagina è già visibile» rimette
# esattamente il difetto: «visibile» non è «idratata».
- assertVisible: "Benvenuto/a!"

- tapOn:
    below: "Email"
- inputText: ${KV_EMAIL}
- hideKeyboard
- tapOn:
    below: "Password"
- inputText: ${KV_PASSWORD}
- hideKeyboard
- tapOn: "Accedi"

- runFlow:
    when:
      visible: "Non consentire"
    commands:
      - tapOn: "Non consentire"

# ── 2. DASHBOARD DOCENTE ─────────────────────────────────────────────────────
# Gate d'idratazione su un elemento STABILE (la tab "Dashboard" della bottom-nav),
# non sul saluto: "Buongiorno!" è orario (src/lib/ui/greeting.ts) e di pomeriggio
# diventa "Buon pomeriggio!".
#
# ⚠️ Il quinto tab si prende con un selettore ALTERNATO, perché il nome con cui
# arriva ad Android dipende dalla versione della WebView, non dall'app:
#   · WebView 109 (KV-api33)     → content-desc = «Menu · tutte le sezioni»
#   · WebView 150 (KV-play-phone) → text = «MENU», content-desc VUOTA
# Misurato il 2026-08-02 con `adb shell uiautomator dump`: sulla dashboard il
# quinto tab è `text="MENU" class=android.widget.Button content-desc=""`. Il
# ponte Chromium → AccessibilityNodeInfo è cambiato per i <button> che hanno SIA
# aria-label SIA testo interno visibile; i bottoni di sola icona espongono ancora
# il loro aria-label. Spiegazione per esteso, con le due misure e la storia dei
# due errori opposti, in android-percorso-genitore.yaml.
# Il lock `__tests__/architecture/maestro-flows-selettori.test.ts` (R4, R8b)
# continua a vietare «Menu»/«MENU» NUDI: da soli sono morti su WebView 109 e
# ambigui col foglio aperto. L'alternanza ancorata è un'altra cosa, e regge
# entrambe le esposizioni.
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 60000
- assertVisible:
    text: "Menu · tutte le sezioni|^MENU$"
- takeScreenshot: /tmp/kv-android-docente-1-dashboard

# ── 3. PRESENZE (appello) ────────────────────────────────────────────────────
# La CTA appello è stato-dipendente: "Fai l'appello ora" se non ancora registrato,
# "Modifica appello" se già fatto (src/app/(dashboard)/teacher/page.tsx). Selettore
# regex robusto ai due stati.
- scrollUntilVisible:
    element:
      text: "Fai l'appello ora|Modifica appello"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    text: "Fai l'appello ora|Modifica appello"
- extendedWaitUntil:
    visible: "Appello"
    timeout: 45000
- takeScreenshot: /tmp/kv-android-docente-2-appello

# ── 4. COMUNICAZIONI (bacheca) ───────────────────────────────────────────────
# ⚠️ DUE TRAPPOLE, entrambe misurate, entrambe capaci di far accusare l'app.
#
# (1) «Apri la bacheca» è STATO-DIPENDENTE: la sezione COMUNICAZIONI della
#     dashboard è renderizzata solo se `avvisiRecenti.length > 0`
#     (src/app/(dashboard)/teacher/page.tsx:242). Il 2026-08-01 la CTA c'era alle
#     00:27 e NON c'era alle 00:45 — stessa app, stesso account, dati diversi.
#     Un flow che la dà per scontata fallisce con «No visible element found» e
#     sembra una regressione. Perciò la strada PRINCIPALE è il foglio «Menu»,
#     che non dipende dai dati (sottotitolo univoco «Avvisi e comunicazioni»,
#     messages/it/teacherNav.json → voceBachecaSub).
#
# (2) Quando la CTA c'è, è SOTTO LA PIEGA: tornando dall'appello la dashboard
#     resta scrollata, la CTA esce dal viewport e la WebView la proietta a fondo
#     pagina SCHIACCIATA — misurata [438,1857][643,1857], larga 205 px e ALTA 0.
#     `extendedWaitUntil: visible` passa lo stesso (il nodo esiste), il tap
#     risulta COMPLETED e il tocco cade su un'area morta. Per questo il ramo A
#     fa `scrollUntilVisible` prima del tap e un'asserzione NEGATIVA dopo: il
#     lock R7 pretende entrambe le cose, anche dentro un `runFlow`.
- tapOn: "Dashboard"
- extendedWaitUntil:
    visible: "Menu · tutte le sezioni|^MENU$"
    timeout: 30000

# Ramo A — la CTA c'è: si passa di lì, perché è il percorso reale dell'insegnante
# ed è il punto dove vive la trappola del nodo alto 0.
- runFlow:
    when:
      visible: "Apri la bacheca"
    commands:
      - scrollUntilVisible:
          element:
            text: "Apri la bacheca"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn: "Apri la bacheca"
      - extendedWaitUntil:
          visible: "Circolari e avvisi alle famiglie"
          timeout: 45000
      - assertNotVisible: "Apri la bacheca"

# Ramo B — nessun avviso recente, niente CTA: alla bacheca si arriva dal foglio
# «Menu». La condizione guarda la DESTINAZIONE, non la CTA: così il ramo B parte
# solo se il ramo A non ci è già arrivato (i due rami non si sovrappongono mai).
- runFlow:
    when:
      notVisible: "Circolari e avvisi alle famiglie"
    commands:
      - tapOn:
          text: "Menu · tutte le sezioni|^MENU$"
      - extendedWaitUntil:
          visible: "Avvisi e comunicazioni"
          timeout: 20000
      # ⚠️ «visibile» NON vuol dire «toccabile». Misurato il 2026-08-01: la voce
      # sta a [254,1632][580,1672] e uiautomator colloca la bottom-nav a
      # [31,1664][1047,1824] → sembra libera per 30 px. Il DOM dice altro:
      # `document.elementFromPoint` su quel punto restituisce il <a> del tab
      # «Diario», e il contenitore della nav parte a y=1605 device (il rettangolo
      # dell'albero è il <nav> interno, senza il suo padding). Il tap si perde: il
      # foglio si chiude e non si naviga — riprodotto anche con `adb shell input
      # tap`, quindi non è Maestro. Centrare l'elemento lo porta fuori da quella
      # fascia morta.
      - scrollUntilVisible:
          element:
            text: "Avvisi e comunicazioni"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn: "Avvisi e comunicazioni"
      - extendedWaitUntil:
          visible: "Circolari e avvisi alle famiglie"
          timeout: 45000
      # Negativa: l'occhiello del foglio esiste solo a foglio aperto.
      - assertNotVisible: "TUTTE LE SEZIONI"

# Comunque ci si sia arrivati, si è in bacheca: qui il flow torna deterministico.
- assertVisible: "Circolari e avvisi alle famiglie"
- takeScreenshot: /tmp/kv-android-docente-3-bacheca

# ── 5. TASTO INDIETRO DI ANDROID ─────────────────────────────────────────────
- back
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 20000
- takeScreenshot: /tmp/kv-android-docente-4-back
