name: Prova concorrenza posti (CI)

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  QUESTO WORKFLOW SCRIVE SU UN DATABASE. Si lancia a mano, consapevolmente.
#     È il progetto Supabase **della CI** (`kidville-web-ci`), non la produzione,
#     e la stessa guardia di `migrate-ci.yml` si rifiuta di partire se i dati
#     assomigliano a quelli veri.
#
# PERCHÉ ESISTE.
#
# Il tetto dei posti di un avviso è difeso da `SELECT … FOR UPDATE` sulla riga
# `avvisi`, dentro le RPC introdotte da `20260919132612`. Nessun `UNIQUE` e
# nessun `EXCLUDE` sa esprimere `SUM(numero_partecipanti) <= posti_totali`: la
# serializzazione è l'unica cosa che impedisce a due genitori di prendere lo
# stesso ultimo posto. Il precedente doloroso è il saldo ticket
# (`20260907181116`): incasso doppio, saldo singolo.
#
# E `vitest` NON PUÒ DIMOSTRARLO. I test unitari provano che la route invoca la
# RPC con quegli argomenti; la serializzazione avviene dentro Postgres, e un
# mock è verde con e senza il lock. Il PRD lo dichiara da sempre come il rischio
# numero 1 del cantiere avvisi, e la prova a due sessioni scritta nella
# migrazione non l'aveva mai eseguita nessuno: su quella macchina non c'era
# `psql`, né Docker, né un Postgres locale, e l'unico server raggiungibile era
# la PRODUZIONE. Questo workflow è quel `psql` mancante, puntato sul database
# giusto.
#
# PERCHÉ NON UN TEST PLAYWRIGHT CHE SPARA DUE POST IN PARALLELO.
#
# Perché non dimostrerebbe niente. Due richieste HTTP «insieme» non garantiscono
# che le due transazioni si sovrappongano: sarebbero verdi anche SENZA il lock,
# ogni volta che il caso le serializza da sé — cioè quasi sempre. Un test che
# passa per fortuna è peggio di nessun test, perché qualcuno si fida.
#
# QUI INVECE LA SOVRAPPOSIZIONE SI VERIFICA, non si spera: la sessione A apre
# una transazione e NON la chiude; si interroga `pg_stat_activity` finché la
# sessione B non risulta **in attesa di un Lock**; solo allora A conferma. Se il
# `FOR UPDATE` sparisse, B non aspetterebbe nessuno e il passo che pretende
# quell'attesa fallirebbe — cioè il contrario di un test che diventa verde per
# caso.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}

jobs:
  prova:
    name: due sessioni psql sul tetto dei posti
    runs-on: ubuntu-latest

    # Lo stesso gruppo del job `e2e` e di `migrate-ci`: questa prova scrive righe
    # di collaudo e poi le toglie, ma mentre gira non deve incrociare una suite
    # E2E sullo stesso database.
    concurrency:
      group: e2e-ci-db
      cancel-in-progress: false

    env:
      PGURL: ${{ secrets.CI_SUPABASE_DB_URL }}
      CI_URL: ${{ secrets.CI_SUPABASE_URL }}
      PROD_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Verifica che psql sia disponibile
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq postgresql-client; }
          psql --version

      # ───────────────────────────────────────────────────────────────────────
      # LA GUARDIA. Copiata da `migrate-ci.yml` e per la stessa ragione: se il
      # secret venisse un giorno riempito con la connessione di produzione,
      # questo workflow scriverebbe righe di collaudo dentro i dati di famiglie
      # vere. Non c'è un secondo controllo umano a valle.
      #
      # ⚠️ Il criterio NON è «c'è la sede e2e00000-* quindi è la CI»: è falso, e
      # misurato — la produzione ne ha una anche lei. Discrimina il suo
      # complementare: quante sedi NON sono nell'elenco ammesso. In produzione
      # sono 3, qui devono essere 0.
      # ───────────────────────────────────────────────────────────────────────
      - name: Guardia — è davvero il database della CI, e non la produzione?
        run: |
          set -euo pipefail
          if [ -z "${PGURL:-}" ]; then
            echo "::error::il secret CI_SUPABASE_DB_URL non è configurato"; exit 1
          fi

          estrai_ref() {
            printf '%s' "$1" \
              | grep -oE '(db\.[a-z0-9]{16,24}\.supabase\.(co|com)|postgres\.[a-z0-9]{16,24}[:@]|//[a-z0-9]{16,24}\.supabase\.(co|com))' \
              | head -n 1 | grep -oE '[a-z0-9]{16,24}' \
              | grep -v -x -E 'supabase|postgres' | head -n 1
          }

          ref_conn=$(estrai_ref "$PGURL" || true)
          ref_atteso=$(estrai_ref "${CI_URL:-}" || true)
          if [ -z "$ref_conn" ] || [ -z "$ref_atteso" ]; then
            echo "::error::non riconosco il project ref nei secret: mi fermo invece di indovinare"; exit 1
          fi
          if [ "$ref_conn" != "$ref_atteso" ]; then
            echo "::error::la connessione NON punta al progetto della CI. Niente eseguito."; exit 1
          fi
          if [ -n "${PROD_URL:-}" ]; then
            ref_prod=$(estrai_ref "$PROD_URL" || true)
            if [ -n "$ref_prod" ] && [ "$ref_prod" = "$ref_conn" ]; then
              echo "::error::la connessione punta allo STESSO progetto della produzione. Mi fermo."; exit 1
            fi
          fi
          echo "identità ✔"

          righe=$(psql -d "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            select
              (select count(*) from public.schools
                where id::text not like 'e2e00000%'
                  and id <> 'c0110a0d-0000-4000-8000-000000000001'),
              (select count(*) from public.alunni),
              (select count(*) from public.enrollment_submissions)
          ")
          IFS='|' read -r sedi_fuori alunni iscrizioni <<< "$righe"
          echo "sedi fuori elenco=$sedi_fuori · alunni=$alunni · iscrizioni=$iscrizioni"
          fermati=0
          [ "$sedi_fuori" -ne 0 ] && { echo "::error::$sedi_fuori sedi reali: non è la CI"; fermati=1; }
          [ "$alunni" -gt 20 ]    && { echo "::error::$alunni alunni: troppi per la CI"; fermati=1; }
          [ "$iscrizioni" -gt 20 ] && { echo "::error::$iscrizioni iscrizioni: troppe per la CI"; fermati=1; }
          [ "$fermati" -ne 0 ] && { echo "::error::GUARDIA SCATTATA. Niente eseguito."; exit 1; }
          echo "::notice::guardia superata"

      # ───────────────────────────────────────────────────────────────────────
      # PREREQUISITO. Se le colonne non ci sono, questa prova non può esistere:
      # va detto forte, invece di fallire più avanti con un messaggio che sembra
      # un difetto del prodotto. Si applica prima `migrate-ci.yml`.
      # ───────────────────────────────────────────────────────────────────────
      - name: La migrazione dei posti è applicata su questo database?
        run: |
          set -euo pipefail
          n=$(psql -d "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
             where n.nspname='public' and p.proname='avviso_adesione_registra'")
          if [ "$n" != "1" ]; then
            # I backtick NON si scrivono qui dentro: fra doppi apici bash li legge
            # come sostituzione di comando e proverebbe a ESEGUIRE il nome della
            # funzione. Il messaggio uscirebbe mutilato, con un «command not found»
            # accanto che non c'entra niente.
            echo "::error::la funzione avviso_adesione_registra non esiste su questo database (trovate: $n). Applica prima 20260919132612 con «DB migrate (CI)»."
            exit 1
          fi
          iso=$(psql -d "$PGURL" -v ON_ERROR_STOP=1 -At -c "show default_transaction_isolation")
          echo "isolamento predefinito: $iso"
          if [ "$iso" != "read committed" ]; then
            echo "::error::isolamento «$iso»: questa prova è scritta per READ COMMITTED (sotto REPEATABLE READ il secondo attore prenderebbe 40001 invece di bloccarsi, che è un esito diverso e va letto diversamente)."
            exit 1
          fi

      # ───────────────────────────────────────────────────────────────────────
      # LA PROVA. Tre atti, e il secondo è quello che conta.
      # ───────────────────────────────────────────────────────────────────────
      - name: Due sessioni sull'ultimo posto
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"

          # ── Atto 0: il banco di prova ────────────────────────────────────
          # Un avviso con UN posto solo, sulla sede fittizia della CI. Gli uuid
          # sono generati qui e stampati: se qualcosa restasse indietro, si sa
          # esattamente cosa cancellare.
          # ⚠️ GLI IDENTIFICATIVI SI PRENDONO DAL SEED, NON SI INVENTANO.
          # `avvisi_risposte` ha due chiavi esterne — `parent_id → utenti(id)` e
          # `student_id → alunni(id)` — verificate con `pg_constraint` prima di
          # scrivere questo passo. Con uuid generati sul momento la prova
          # fallirebbe con un errore di FK che SEMBRA un difetto del prodotto, e
          # si passerebbe mezz'ora a cercarlo nel posto sbagliato.
          # Servono due COPPIE distinte: l'unicità è su (avviso, genitore, alunno).
          leggi() { psql -d "$PGURL" -v ON_ERROR_STOP=1 -At -c "$1"; }

          SCUOLA=$(leggi "select id from public.schools where id::text like 'e2e00000%' order by id limit 1")
          AUTORE=$(leggi "select id from public.utenti order by id limit 1")
          P1=$(leggi "select id from public.utenti order by id limit 1")
          P2=$(leggi "select id from public.utenti order by id offset 1 limit 1")
          A1=$(leggi "select id from public.alunni order by id limit 1")
          A2=$(leggi "select id from public.alunni order by id offset 1 limit 1")
          AVVISO=$(leggi "select gen_random_uuid()")

          for coppia in "SCUOLA:$SCUOLA" "AUTORE:$AUTORE" "P1:$P1" "P2:$P2" "A1:$A1" "A2:$A2"; do
            if [ -z "${coppia#*:}" ]; then
              echo "::error::${coppia%%:*} non trovato: il seed della CI non è passato su questo database, oppure la sede e2e00000-* non esiste. Lancia prima «npm run e2e:seed» (job e2e di ci.yml)."
              exit 1
            fi
          done
          if [ "$P1" = "$P2" ] || [ "$A1" = "$A2" ]; then
            echo "::error::servono DUE genitori e DUE alunni distinti: trovati P1=$P1 P2=$P2 A1=$A1 A2=$A2. Con la stessa coppia la seconda chiamata sarebbe una MODIFICA della prima, non una gara — e il test sarebbe verde senza provare niente."
            exit 1
          fi
          echo "::notice::avviso di prova $AVVISO (sede $SCUOLA)"

          # `target_scope` = 'globale': è uno dei due valori realmente in uso
          # ('classe' e 'globale'); non c'è un CHECK che li limiti, ma inventarne
          # uno terzo lascerebbe in giro una riga che nessuna schermata sa leggere.
          # ⚠️ NIENTE HEREDOC in questo file: il terminatore di un heredoc bash
          # deve stare a COLONNA ZERO, e a colonna zero il blocco `run: |` dello
          # YAML è già finito. Il workflow non sarebbe nemmeno caricabile — errore
          # «could not find expected ':'», che non nomina né bash né l'heredoc.
          psql -d "$PGURL" -v ON_ERROR_STOP=1 -c "
            insert into public.avvisi (id, author_id, titolo, contenuto, tipo, target_scope,
                                       scuola_id, scadenza_avviso, scadenza_adesione, posti_totali)
            values ('$AVVISO', '$AUTORE', 'PROVA CONCORRENZA — cancellabile',
                    'Riga creata dal workflow prova-concorrenza-posti. Se la trovi, il workflow e morto a meta: cancellala.',
                    'adesione', 'globale', '$SCUOLA', now() + interval '1 day', now() + interval '1 day', 1)"

          # ── Atto 0-bis: IL CONTROLLO NEGATIVO ────────────────────────────
          #
          # Aggiunto il 2026-09-20, dopo che il primo giro era passato al PRIMO
          # sondaggio (`sessioni in attesa di Lock = 1`) senza che nessuno avesse
          # mai visto quel sondaggio rispondere ZERO. Un contatore che nessuno ha
          # visto dire zero non è un contatore: è una costante travestita, e
          # questo repo ci è già cascato abbastanza volte da non doverlo rifare.
          #
          # Qui nessuna sessione sta ancora chiamando la RPC, quindi il sondaggio
          # DEVE rispondere 0. Se rispondesse 1, il filtro pescherebbe qualcos'altro
          # — e il «✔ bloccata» dell'Atto 2 non dimostrerebbe più niente.
          sonda() {
            psql -d "$PGURL" -v ON_ERROR_STOP=1 -At -c "
              select count(*) from pg_stat_activity
               where wait_event_type = 'Lock' and state = 'active'
                 and query ilike '%avviso_adesione_registra%'"
          }
          base=$(sonda)
          echo "controllo negativo — sessioni in attesa PRIMA di cominciare: $base"
          if [ "${base:-9}" != "0" ]; then
            echo "::error::il sondaggio dice $base con NESSUNA sessione in gara: il filtro pesca qualcosa che non è la nostra prova, e il «bloccata ✔» dell'atto 2 non dimostrerebbe niente. (Possibile causa: un giro precedente di questo stesso workflow è rimasto appeso.)"
            exit 1
          fi

          # ── Atto 1: A prende l'ultimo posto e NON conferma ────────────────
          #
          # `pg_sleep` invece di `\! sleep`: la pausa avviene DENTRO il server,
          # nella stessa transazione, quindi il lock resta preso anche se il
          # client viene messo in pausa o ucciso dal runner. Con `\!` la pausa è
          # del client, e una `psql` fermata dal sistema chiuderebbe la
          # connessione — rilasciando il lock e rendendo verde una prova che non
          # ha provato niente.
          #
          # Le tre istruzioni viaggiano in UN SOLO `-c`, che psql invia come un
          # unico blocco: sono quindi una transazione sola, ed è esattamente ciò
          # che serve. Il `begin`/`commit` espliciti restano per leggibilità.
          (
            psql -d "$PGURL" -v ON_ERROR_STOP=1 -c "
              begin;
              select 'A:' || (public.avviso_adesione_registra(
                '$AVVISO','$P1','$A1','si',1::smallint, now()) ->> 'stato');
              select pg_sleep(25);
              commit;" > "$T/a.txt" 2>&1
          ) &
          PID_A=$!

          sleep 6

          # ── Atto 2: B chiede lo stesso posto, e DEVE aspettare ────────────
          (
            psql -d "$PGURL" -v ON_ERROR_STOP=1 -c "
              select 'B:' || (public.avviso_adesione_registra(
                '$AVVISO','$P2','$A2','si',1::smallint, now()) ->> 'stato')" > "$T/b.txt" 2>&1
          ) &
          PID_B=$!

          # ⚠️ IL PASSO CHE RENDE QUESTA PROVA UNA PROVA. Senza, il workflow
          # sarebbe verde anche togliendo il `FOR UPDATE`: le due sessioni si
          # serializzerebbero da sole per via dei `sleep`, e l'esito finale
          # sembrerebbe giusto. Qui si pretende di VEDERE B fermo su un Lock.
          bloccato=0
          for i in $(seq 1 15); do
            n=$(sonda)
            echo "  sondaggio $i: sessioni in attesa di Lock = $n"
            if [ "${n:-0}" -ge 1 ]; then bloccato=1; break; fi
            sleep 2
          done

          if [ "$bloccato" != "1" ]; then
            echo "::error::La seconda sessione NON si è mai fermata su un Lock. O il SELECT … FOR UPDATE non c'è più, o non copre questo percorso: senza quel blocco due genitori possono prendere lo stesso ultimo posto."
            kill $PID_A $PID_B 2>/dev/null || true
            psql -d "$PGURL" -c "delete from public.avvisi_risposte where avviso_id='$AVVISO'; delete from public.avvisi where id='$AVVISO';" >/dev/null 2>&1 || true
            exit 1
          fi
          echo "::notice::la seconda sessione è BLOCCATA sul lock della prima ✔"

          wait $PID_A || true
          wait $PID_B || true
          echo "── sessione A ──"; cat "$T/a.txt"
          echo "── sessione B ──"; cat "$T/b.txt"

          # ── Atto 3: l'esito ──────────────────────────────────────────────
          esito=$(psql -d "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            select coalesce(string_agg(stato_adesione, ',' order by stato_adesione), '(nessuna riga)')
              from public.avvisi_risposte where avviso_id = '$AVVISO'")
          occupati=$(psql -d "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            select public.avviso_posti_occupati('$AVVISO', null)")
          echo "stati delle due adesioni: $esito"
          echo "posti occupati: $occupati (tetto: 1)"

          {
            echo "### Prova di concorrenza sul tetto dei posti"
            echo ""
            echo "| grandezza | atteso | misurato |"
            echo "|---|---|---|"
            echo "| sondaggio PRIMA della gara (controllo negativo) | 0 | **$base** |"
            echo "| la 2ª sessione si ferma su un Lock | sì | **sì** |"
            echo "| stati delle due adesioni | \`ammessa,in_attesa\` | \`$esito\` |"
            echo "| posti occupati (tetto 1) | 1 | **$occupati** |"
          } >> "$GITHUB_STEP_SUMMARY"

          # La pulizia PRIMA delle asserzioni finali: un fallimento non deve
          # lasciare righe di prova sul database di collaudo.
          psql -d "$PGURL" -c "delete from public.avvisi_risposte where avviso_id='$AVVISO'; delete from public.avvisi where id='$AVVISO';" >/dev/null

          if [ "$esito" != "ammessa,in_attesa" ]; then
            echo "::error::stati «$esito» invece di «ammessa,in_attesa»: il tetto non ha retto, oppure l'adesione è stata spezzata."
            exit 1
          fi
          if [ "$occupati" != "1" ]; then
            echo "::error::posti occupati $occupati su un tetto di 1: due adesioni sono entrate."
            exit 1
          fi
          echo "::notice::tetto rispettato: una ammessa, una in coda, 1 posto occupato su 1"

      # Se qualcosa muore a metà, l'avviso di prova resta: questo passo lo toglie
      # comunque. Filtra sul TITOLO, che è scritto per essere riconoscibile, e
      # solo sugli avvisi della sede fittizia.
      - name: Bonifica (anche se la prova è fallita)
        if: always()
        run: |
          set -euo pipefail
          # Una sola DELETE: `avvisi_risposte.avviso_id` ha ON DELETE CASCADE
          # (verificato in `pg_constraint`), quindi le risposte se ne vanno da
          # sole. Il filtro è sul TITOLO — scritto apposta per essere
          # riconoscibile — E sulla sede fittizia: due condizioni, perché una
          # DELETE di bonifica che sbaglia bersaglio è il difetto peggiore che
          # possa avere un workflow di collaudo.
          n=$(psql -d "$PGURL" -At -c "
            delete from public.avvisi
             where titolo = 'PROVA CONCORRENZA — cancellabile'
               and scuola_id::text like 'e2e00000%'
            returning 1" | grep -c 1) || n=0
          echo "avvisi di prova rimossi: $n"
