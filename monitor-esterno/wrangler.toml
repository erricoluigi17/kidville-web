# Il monitor esterno su Cloudflare: vedi `worker.mjs` (cosa fa) e `docs/cicd.md` (come si gestisce).
# Nessun indirizzo pubblico: il Worker ha solo il cron. Il token sta nei segreti del Worker
# (`npx wrangler@4.148.0 secret put GITHUB_TOKEN_CAMPANELLO`), MAI in questo file: il repository è pubblico.
name = "kidville-monitor-esterno"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
