# =============================================================================
# Kidville · ANDROID — percorso utente reale del GENITORE
#   login → dashboard → presenze → comunicazioni → tasto Indietro
#
# Prerequisiti (vedi .claude/maestro-flows/README.md):
#   - emulatore Android avviato
#   - server sull'host, porta 3000 — usare `npx next start` (BUILD di produzione):
#     con `next dev`/Turbopack l'HMR-websocket non completa l'handshake via il
#     bridge 10.0.2.2 e la WebView non idrata (React non monta i fiber).
#   - APK buildato con CAP_SERVER_URL="http://10.0.2.2:3000" e installato
#   - credenziali negli env MAESTRO_KV_EMAIL_GENITORE / MAESTRO_KV_PASSWORD
#     ⚠️ vanno ESPORTATE nell'ambiente: `-e KV_EMAIL=...` NON sovrascrive il
#     blocco env: sottostante, e un ${...} non risolto viene digitato come
#     la stringa letterale "undefined".
#
# Esecuzione:
#   export MAESTRO_KV_EMAIL_GENITORE=... MAESTRO_KV_PASSWORD=...
#   maestro test .claude/maestro-flows/android-percorso-genitore.yaml
#
# NB: l'app è una WebView Capacitor che carica l'app web da server.url. I tempi
# di attesa sono generosi di proposito: la prima pagina passa dalla rete.
# Selettori RI-MISURATI sull'albero di accessibilità il 2026-07-31/08-01
# (emulatore KV-play-phone, Android 16, `adb shell uiautomator dump`).
# =============================================================================
appId: it.kidville.app
name: Kidville · Android — percorso genitore
tags:
  - android
  - genitore
env:
  KV_EMAIL: ${MAESTRO_KV_EMAIL_GENITORE}
  KV_PASSWORD: ${MAESTRO_KV_PASSWORD}
---
- launchApp:
    clearState: true

# ── 1. LOGIN ─────────────────────────────────────────────────────────────────
# Card di login: titolo "Benvenuto/a!", campi Email e Password, CTA "Accedi".
- extendedWaitUntil:
    visible: "Accedi al tuo account Kidville"
    timeout: 60000
- assertVisible: "Benvenuto/a!"
- takeScreenshot: /tmp/kv-android-genitore-0-login

- tapOn:
    below: "Email"
- inputText: ${KV_EMAIL}
- hideKeyboard

- tapOn:
    below: "Password"
- inputText: ${KV_PASSWORD}
- hideKeyboard

- tapOn: "Accedi"

# Il primo avvio può mostrare il dialog nativo dei permessi notifiche: chiudilo.
- runFlow:
    when:
      visible: "Non consentire"
    commands:
      - tapOn: "Non consentire"

# ── 2. DASHBOARD ─────────────────────────────────────────────────────────────
# Bottom nav del genitore. Il quinto tab si seleziona con il suo ARIA-LABEL
# "Menu · tutte le sezioni", NON con la scritta «MENU» che si vede a schermo.
#
# ⚠️ Qui è dove questo flow ha mentito per mesi (corretto il 2026-07-31, misurato
# con `adb shell uiautomator dump` su KV-play-phone): il commento precedente
# sosteneva che la WebView collassasse il <button> col suo <span> ed esponesse
# «MENU». È falso, e non per colpa della WebView: è ARIA. Il quinto tab è
#   <button aria-label={t('ariaMenu')}> <Icon/> <span>{t('tabMenu')}</span> </button>
# e il calcolo del nome accessibile (accname, passo 2C) dice che l'`aria-label`
# SOSTITUISCE il contenuto. Dump della home genitore: 'HOME', 'DIARIO', 'AVVISI',
# 'CHAT' e — per il quinto tab — 'Menu · tutte le sezioni' [834,1664][1039,1824].
# «MENU» lì non compare affatto; in una seconda misura (2026-08-01, col foglio
# aperto) compare nella topbar a [94,63][322,63], cioè ALTO 0 px: inservibile
# comunque, ma è bene sapere che può esistere. (Nemmeno come stringa: `tabMenu` vale
# «Menu», la maiuscola è `text-transform: uppercase`; nei primi quattro tab
# Chromium la applica anche al nome accessibile, ed è per questo che il dump
# mostra 'HOME' e non 'Home'. Il match di Maestro è case-insensitive: irrilevante
# per il selettore, decisivo per capire perché la teoria sbagliata sembrava reggere.)
# Il lock `__tests__/architecture/maestro-flows-selettori.test.ts` (R4, R8)
# impedisce che «MENU» rientri, e la fonte del testo è messages/it/nav.json →
# `ariaMenu` (se cambia lì, il lock diventa rosso: R5).
- extendedWaitUntil:
    visible: "Avvisi"
    timeout: 60000
- assertVisible: "Home"
- assertVisible:
    text: "Menu · tutte le sezioni"
- takeScreenshot: /tmp/kv-android-genitore-1-dashboard

# ── 3. PRESENZE ──────────────────────────────────────────────────────────────
# "Presenze" vive nel foglio Menu; la voce è resa con il sottotitolo univoco
# "Assenze e giustifiche" (selettore robusto rispetto alle voci vicine).
- tapOn:
    text: "Menu · tutte le sezioni"
- extendedWaitUntil:
    visible: "Assenze e giustifiche"
    timeout: 20000
- tapOn: "Assenze e giustifiche"
- extendedWaitUntil:
    visible: "Segnala assenza"
    timeout: 45000
- takeScreenshot: /tmp/kv-android-genitore-2-presenze

# ── 4. COMUNICAZIONI ─────────────────────────────────────────────────────────
# Tab "Avvisi" della bottom nav → pagina "Comunicazioni".
- tapOn: "Avvisi"
- extendedWaitUntil:
    visible: "Comunicazioni"
    timeout: 45000
- takeScreenshot: /tmp/kv-android-genitore-3-avvisi

# ── 5. TASTO INDIETRO DI ANDROID ─────────────────────────────────────────────
# Deve tornare indietro DENTRO l'app, non chiuderla al primo tap.
- back
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- assertVisible:
    text: "Menu · tutte le sezioni"
- takeScreenshot: /tmp/kv-android-genitore-4-back
