name: CI

# Gate di qualità su ogni PR e su main.
# La branch protection su `main` richiede che i job `quality` ed `e2e`
# siano verdi prima del merge: così Vercel deploya in produzione solo
# codice che ha superato lint, typecheck, unit ed end-to-end.

on:
  pull_request:
  push:
    branches: [main]

# Evita run duplicate sullo stesso ref (es. push su un branch con PR aperta).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (zero warning)
        run: npx eslint . --max-warnings 0

      # ─────────────────────────────────────────────────────────────────────────
      # FFMPEG PINNATO — non `apt-get install ffmpeg`, e non è pignoleria.
      #
      # La conversione video gira in un Vercel Sandbox su UNA build precisa di
      # FFmpeg. Se qui girasse la build di Ubuntu, un test verde direbbe che *una
      # certa* FFmpeg fa una certa cosa — non che la faccia quella che convertirà i
      # video dei bambini. Che due build della stessa famiglia divergano non è
      # un'ipotesi: misurato il 2026-09-17, `brew install ffmpeg` 8.1.2 NON ha il
      # filtro `zscale`, e senza `zscale` l'intero ramo HDR→SDR di
      # `src/lib/media/video/encode.ts` non esiste. Un collaudo su quella build non
      # sta misurando la nostra conversione.
      #
      # DAL 2026-10-02 LA BUILD NON SI SCARICA PIÙ DA INTERNET. Il 29/09/2026 BtbN
      # ha cancellato la release datata da cui questo passo la prendeva (404), e
      # l'unica copia rimasta era nella cache di GitHub Actions, che elimina una
      # cache dopo 7 giorni senza accessi. I due binari — `ffmpeg.gz` e `ffprobe.gz`,
      # compressi con `gzip -9 -n` — vivono adesso nel NOSTRO bucket privato
      # `video_build` (Supabase Storage), insieme all'archivio originale come
      # provenienza. Sono gli stessi file che usa il runner di produzione.
      #
      # DA DOVE LI PRENDE QUESTO PASSO
      #   1. dalla cache `~/.cache/kidville-ffmpeg-bin`, la cui chiave porta le
      #      impronte dei due binari: cambiare build cambia chiave;
      #   2. a cache vuota, dai due URL firmati nei segreti `CI_FFMPEG_GZ_URL` e
      #      `CI_FFPROBE_GZ_URL`, dichiarati SOLO in questo passo.
      # In entrambi i casi poi si verificano le impronte: quelle dei `.gz` PRIMA di
      # decomprimerli, quelle dei binari DOPO. Sono le stesse quattro di
      # `src/lib/media/video/build.ts` e della spec
      # `docs/superpowers/specs/2026-09-16-video-build-verificata.md`, e il lock
      # `__tests__/architecture/fixture-video-reali` fallisce se divergono.
      #
      # ⚠️ GLI URL FIRMATI SCADONO. Valgono 365 giorni dalla firma: quelli attuali
      # sono stati firmati il 2026-10-02 e scadono il 2027-10-02. Servono solo a
      # cache vuota — cioè dopo una settimana senza run — ma quel giorno un passo
      # rosso senza spiegazioni costerebbe ore: il messaggio d'errore qui sotto
      # rimanda a questo commento. Si rinnovano da una persona che abbia accesso al
      # progetto Supabase e al repository, con la CLI già autenticata:
      #
      #   supabase projects api-keys --project-ref uimulkjyekgemjakmepp -o json \
      #     | node scripts/ffmpeg-nel-bucket.mjs --firma-ci ffmpeg | gh secret set CI_FFMPEG_GZ_URL
      #   supabase projects api-keys --project-ref uimulkjyekgemjakmepp -o json \
      #     | node scripts/ffmpeg-nel-bucket.mjs --firma-ci ffprobe | gh secret set CI_FFPROBE_GZ_URL
      #
      # Lo script scrive l'URL SOLO se stdout non è un terminale, così non finisce a
      # schermo né nella cronologia. Dopo il rinnovo, aggiornare qui la data.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Cache dei binari FFmpeg pinnati
        uses: actions/cache@v4
        with:
          path: ~/.cache/kidville-ffmpeg-bin
          key: ffmpeg-bin-341447cfff51ff528cf530eb111542306cffc1f1f6a51726e6327b655d6860be-09c3b0595ea6dd648e0cf1b462d97303792b31cb81c0359b65d072c0d7254063
      - name: FFmpeg pinnato (la build del Sandbox di produzione, non quella della distro)
        env:
          # Gli URL firmati: dichiarati qui e in nessun altro punto del workflow.
          CI_FFMPEG_GZ_URL: ${{ secrets.CI_FFMPEG_GZ_URL }}
          CI_FFPROBE_GZ_URL: ${{ secrets.CI_FFPROBE_GZ_URL }}
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/kidville-ffmpeg-bin"
          DEST="$HOME/.local/kidville-ffmpeg"
          mkdir -p "$CACHE" "$DEST"
          if [ ! -f "$CACHE/ffmpeg.gz" ] || [ ! -f "$CACHE/ffprobe.gz" ]; then
            if [ -z "${CI_FFMPEG_GZ_URL:-}" ] || [ -z "${CI_FFPROBE_GZ_URL:-}" ]; then
              echo "::error::binari FFmpeg non in cache e segreti CI_FFMPEG_GZ_URL / CI_FFPROBE_GZ_URL assenti o vuoti: vedi il commento sopra a questo passo"
              exit 1
            fi
            echo "::notice::binari non in cache, li scarico dal nostro bucket video_build"
            scarica() {
              curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 300 -o "$2" "$1" \
                || { echo "::error::download di $(basename "$2") dal bucket video_build fallito: URL firmato scaduto o revocato? Si rinnova come scritto nel commento sopra a questo passo"; exit 1; }
            }
            scarica "$CI_FFMPEG_GZ_URL" "$CACHE/ffmpeg.gz"
            scarica "$CI_FFPROBE_GZ_URL" "$CACHE/ffprobe.gz"
          fi
          # Le impronte si verificano SEMPRE, anche con la cache calda: una cache
          # corrotta o avvelenata non deve arrivare a un binario eseguibile.
          printf '%s  %s\n%s  %s\n' 'f019aabcb3940d3ddf61554cc96086eb95f98a1978877196b9e6320b52a2a790' "$CACHE/ffmpeg.gz" 'a3cb017c28ce55d622e3328fc4003acf7daa1b05ca63ca7b826f97807f3333a9' "$CACHE/ffprobe.gz" | sha256sum -c -
          gzip -dc "$CACHE/ffmpeg.gz" > "$DEST/ffmpeg"
          gzip -dc "$CACHE/ffprobe.gz" > "$DEST/ffprobe"
          printf '%s  %s\n%s  %s\n' '341447cfff51ff528cf530eb111542306cffc1f1f6a51726e6327b655d6860be' "$DEST/ffmpeg" '09c3b0595ea6dd648e0cf1b462d97303792b31cb81c0359b65d072c0d7254063' "$DEST/ffprobe" | sha256sum -c -
          chmod +x "$DEST/ffmpeg" "$DEST/ffprobe"
          "$DEST/ffmpeg" -version | head -1
          # Meglio saperlo qui, in una riga, che dal rosso di dieci casi fra due minuti.
          FILTRI="$("$DEST/ffmpeg" -hide_banner -filters)"
          if ! grep -qw zscale <<< "$FILTRI"; then
            echo "::error::la build pinnata non espone il filtro zscale: la catena HDR→SDR non può girare"
            exit 1
          fi
          echo "KIDVILLE_VIDEO_FFMPEG_DIR=$DEST" >> "$GITHUB_ENV"

      - name: Typecheck + Unit (tsc --noEmit && vitest run)
        run: npm run gate
      # IL QUARTO COMANDO DEL GATE, che fino al 2026-08-04 non è mai girato in CI.
      # AGENTS.md §«Gate di verifica» ne elenca quattro; qui ne giravano tre. Non è una
      # ridondanza di `npm run gate`: `tsc --noEmit` controlla i tipi e basta, mentre
      # `next build` è l'unico che esegue la raccolta delle rotte, la prerenderizzazione
      # e i controlli di confine server/client — cioè la classe di guasti che i tipi non
      # vedono (un `export const dynamic` sbagliato, un import di modulo Node dentro un
      # Client Component, una pagina che fallisce in prerender).
      #
      # Misurato il 2026-08-04: `next build` non girava in NESSUN punto della pipeline
      # prima che il codice fosse su `main`. Nemmeno nel job `e2e`, che avvia Playwright
      # su `npm run dev`. E nessun check di Vercel è fra i required status checks. Quindi
      # per un giorno un commit è potuto esistere senza che nessuno sapesse se compilava.
      - name: Build (next build)
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Serializza le run che condividono il progetto Supabase CI:
    # il seed lavora sulle scuole dedicate e2e00000-* ed è idempotente,
    # ma due run simultanee sullo stesso DB potrebbero interferire.
    concurrency:
      group: e2e-ci-db
      cancel-in-progress: false
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
      # Password di TUTTI gli account `*.e2e@kidville.test` (8 dal 2026-07-31: il
      # seed semina due sedi — vedi `docs/e2e.md`). Fino al 2026-07-31 era un
      # letterale in `scripts/seed-e2e.mjs`, e il repository è PUBBLICO: il 29/07
      # quell'account è finito in Direzione su Kidville Aversa e Kidville Cesa,
      # sedi vere. Ora sta solo qui. Il seed la RIMPOSTA a ogni run
      # (`auth.admin.updateUserById`): per ruotarla basta cambiare il secret.
      # Assente ⇒ il seed esce con exit 1 e il job è rosso: è voluto, un default
      # renderebbe di nuovo pubbliche le credenziali.
      KV_E2E_PASSWORD: ${{ secrets.CI_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # DUE motori, non uno. `webkit` è il browser della WebView iOS (Capacitor):
      # il progetto `webkit` di playwright.config.ts ripete su di esso i quattro
      # percorsi critici del genitore. Se questa riga e i progetti della config
      # divergono, `__tests__/architecture/e2e-webkit-installato.test.ts` diventa
      # rosso nel job `quality` — prima e più in fretta di quanto lo scoprirebbe
      # qui un browser mancante.
      - name: Installa i browser Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Seed del DB E2E (scuola e2e00000-*)
        run: npm run e2e:seed
      - name: Suite E2E
        run: npm run e2e
      # ⚠️ LA PASSWORD FINIVA IN CHIARO DENTRO L'ARTEFATTO, E L'ARTEFATTO SI SCARICA.
      #
      # Misurato il 2026-08-04 sulla run 30911702345: `playwright-report/` conteneva
      # `KV_E2E_PASSWORD` in CHIARO in tre file. Non è un caso limite ed è nuovo: è
      # l'`error-context.md` che Playwright allega a ogni fallimento, dove la snapshot
      # di accessibilità riporta anche il VALORE dei campi — password compresa, perché
      # `fill()` la scrive nel DOM. Nell'artefatto della run precedente non c'era: è
      # comparso appena un test ha cominciato a fallire sulla schermata di accesso.
      #
      # Questo repository è PUBBLICO, e gli artefatti delle Actions di un repository
      # pubblico sono scaricabili. Quella password apre otto account `*.e2e@kidville.test`
      # su un progetto Supabase separato — non la produzione — ma è comunque un segreto
      # che esce da un secret di GitHub e finisce in un file scaricabile, ed è
      # esattamente il modo in cui il 29 luglio un account di prova si è ritrovato in
      # Direzione su due sedi vere.
      #
      # La bonifica CONTA I FILE CAMBIATI, non quelli esaminati: il 3 agosto una
      # bonifica di questo repo dichiarava «N file ripuliti» contando i file che aveva
      # SELEZIONATO, e il numero era vero anche quando non toccava un byte. Qui il
      # contatore sale solo dopo una sostituzione riuscita, e se resta a zero mentre
      # `grep` aveva trovato qualcosa il passo FALLISCE invece di tacere.
      - name: Bonifica il report dai segreti (prima di caricarlo)
        if: always()
        env:
          KV_E2E_PASSWORD: ${{ secrets.CI_E2E_PASSWORD }}
        run: |
          # `set +e` ESPLICITO, e ci sono voluti due tentativi per capire perché serve.
          #
          # 1° tentativo (run 30914455054): lo script apriva con `set -euo pipefail` e
          #    moriva sulla riga `[ "$trovati" -eq 0 ] && exit 0`. Quando quel test è
          #    FALSO — cioè quando c'è davvero qualcosa da bonificare — il comando
          #    composto ritorna 1, e con `-e` la shell chiude tutto. Il passo falliva
          #    ESATTAMENTE nel solo caso in cui serviva.
          # 2° tentativo (run 30915761622): tolto `-e` dal mio `set`, il passo usciva
          #    ANCORA con 1, e senza stampare una riga. Il motivo è che `-e` non era
          #    mio: GitHub Actions esegue i `run:` con `shell: /usr/bin/bash -e {0}`,
          #    quindi era già attivo PRIMA della mia prima istruzione. Non scriverlo non
          #    basta: va spento.
          #
          # La lezione, che vale oltre questo file: `set -e` più `condizione && azione`
          # è una trappola classica, e in Actions il `-e` non si vede nello script.
          # Qui gli errori si gestiscono a mano, uno per uno, e ogni uscita è esplicita.
          set +e
          set -u
          set -o pipefail
          if [ ! -d playwright-report ]; then
            echo "nessun report da bonificare"
            exit 0
          fi
          if [ -z "${KV_E2E_PASSWORD:-}" ]; then
            echo "::error::KV_E2E_PASSWORD non è nell'ambiente: non posso sapere cosa bonificare"
            rm -rf playwright-report
            exit 1
          fi
          trovati=$(grep -rlF "$KV_E2E_PASSWORD" playwright-report/ 2>/dev/null | wc -l | tr -d ' ')
          echo "file che contengono il segreto: $trovati"
          if [ "$trovati" -eq 0 ]; then
            echo "::notice::nessun segreto nel report"
            exit 0
          fi
          cambiati=0
          while IFS= read -r f; do
            prima=$(sha256sum "$f" | cut -d' ' -f1)
            KV_E2E_PASSWORD="$KV_E2E_PASSWORD" perl -pi -e 's/\Q$ENV{KV_E2E_PASSWORD}\E/[REDATTO]/g' "$f"
            dopo=$(sha256sum "$f" | cut -d' ' -f1)
            [ "$prima" != "$dopo" ] && cambiati=$((cambiati+1))
          done < <(grep -rlF "$KV_E2E_PASSWORD" playwright-report/ 2>/dev/null)
          echo "file effettivamente CAMBIATI: $cambiati"
          rimasti=$(grep -rlF "$KV_E2E_PASSWORD" playwright-report/ 2>/dev/null | wc -l | tr -d ' ')
          if [ "$rimasti" -ne 0 ]; then
            echo "::error::la bonifica non ha ripulito $rimasti file: l'artefatto NON viene caricato"
            rm -rf playwright-report
            exit 1
          fi
          echo "::notice::report bonificato: $cambiati file ripuliti, 0 occorrenze rimaste"

      - name: Report Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
