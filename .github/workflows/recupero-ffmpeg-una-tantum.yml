name: Recupero FFmpeg pinnato (una tantum)

# ─────────────────────────────────────────────────────────────────────────────
# USA E GETTA. Vive SOLO sul branch `fix/video-ffmpeg-bucket` e si toglie nel
# commit successivo: con il merge squash non arriva mai su `main`.
#
# Perché esiste: dal 29/09/2026 la release BtbN `autobuild-2026-09-15-13-18`
# risponde 404 (BtbN tiene le build giornaliere 14 giorni) e la conversione dei
# video in produzione è ferma. L'UNICA copia rimasta dell'archivio già collaudato
# (sha256 adb2d107…) sta nella cache di GitHub Actions creata dalla CI su `main`,
# che GitHub elimina dopo 7 giorni senza accessi. Questo job la ripristina —
# stessa chiave, stesso path, stesso sistema operativo, quindi stessa «version» —
# e consegna i due binari in un artefatto da 1 giorno, da verificare in locale e
# cancellare subito dopo. Nessuna cache nuova, nessun download da Internet.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ['fix/video-ffmpeg-bucket']
    paths: ['.github/workflows/recupero-ffmpeg-una-tantum.yml']

permissions:
  contents: read

jobs:
  recupero:
    runs-on: ubuntu-latest
    steps:
      - name: Ripristino dalla cache della CI (solo restore, mai save)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kidville-ffmpeg
          key: ffmpeg-btbn-adb2d107287cdace0c5d00dd986cd3674c1e86776501640bff3b5cf7d2cf2e71
          fail-on-cache-miss: true

      - name: Verifica, estrazione, impacchettamento
        env:
          ARCHIVIO_SHA256: adb2d107287cdace0c5d00dd986cd3674c1e86776501640bff3b5cf7d2cf2e71
          RADICE: ffmpeg-n9.0.1-30-g9258bacca5-linux64-gpl-9.0
        run: |
          set -euo pipefail
          A="$HOME/.cache/kidville-ffmpeg/ffmpeg-pinnato.tar.xz"
          echo "$ARCHIVIO_SHA256  $A" | sha256sum -c -
          mkdir -p bin out
          tar -xJf "$A" --strip-components=2 -C bin "$RADICE/bin/ffmpeg" "$RADICE/bin/ffprobe"
          chmod +x bin/ffmpeg bin/ffprobe
          bin/ffmpeg -version | head -1 > out/versione.txt
          # Stesso formato di `comandoInventarioBuild()` (runner/preparazione.ts):
          # filtri, separatore, decoder, separatore, encoder.
          {
            bin/ffmpeg -hide_banner -filters
            echo '---SEZIONE---'
            bin/ffmpeg -hide_banner -decoders
            echo '---SEZIONE---'
            bin/ffmpeg -hide_banner -encoders
          } > out/inventario.txt
          gzip -9 -n -c bin/ffmpeg > out/ffmpeg.gz
          gzip -9 -n -c bin/ffprobe > out/ffprobe.gz
          (cd bin && sha256sum ffmpeg ffprobe) > out/SHA256SUMS.binari
          (cd out && sha256sum ffmpeg.gz ffprobe.gz) > out/SHA256SUMS.pacchetti
          cp "$A" out/archivio-btbn.tar.xz
          ls -l bin out | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/SHA256SUMS.binari out/SHA256SUMS.pacchetti out/versione.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artefatto a vita breve
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-pinnato-una-tantum
          path: out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
