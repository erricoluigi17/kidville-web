# =============================================================================
# Kidville · ANDROID — percorso utente reale del GENITORE
#   login → dashboard → presenze → COMUNICA UN'ASSENZA e la ANNULLA →
#   comunicazioni → tasto Indietro
#
# Prerequisiti (vedi .claude/maestro-flows/README.md):
#   - emulatore Android avviato
#   - server sull'host, porta 3000 — usare `npx next start` (BUILD di produzione):
#     con `next dev`/Turbopack l'HMR-websocket non completa l'handshake via il
#     bridge 10.0.2.2 e la WebView non idrata (React non monta i fiber).
#   - APK buildato con CAP_SERVER_URL="http://10.0.2.2:3000" e installato
#   - credenziali negli env MAESTRO_KV_EMAIL_GENITORE / MAESTRO_KV_PASSWORD
#     ⚠️ vanno ESPORTATE nell'ambiente: `-e KV_EMAIL=...` NON sovrascrive il
#     blocco env: sottostante, e un ${...} non risolto viene digitato come
#     la stringa letterale "undefined".
#
# Esecuzione — SEMPRE dallo script, mai `maestro test` a mano (bonifica del log):
#   .claude/maestro-flows/esegui.sh android-percorso-genitore.yaml
#
# ⚠️ QUESTO FLOW SCRIVE SU DATI VERI, e per questo il percorso ANNULLA ciò che
# comunica. Le tappe 4 e 5 fanno un POST e poi la DELETE su
# `/api/parent/presenze/comunica-assenza`: una riga in `presenze` per l'alunno
# dell'account TEST, sul database di PRODUZIONE (`.env.local` punta lì anche
# quando il server è :3100). L'ultima asserzione della tappa 5 — l'elenco che
# torna vuoto — è la PROVA che la riga è stata disfatta, non un abbellimento.
# Se il flow muore fra la tappa 4 e la 5, la comunicazione resta: si annulla a
# mano dalla stessa schermata (Menu → Assenze e giustifiche → «ANNULLA»).
#
# ⚠️ DUE PRECONDIZIONI DELLA TAPPA 4, che sono dell'AMBIENTE e non dell'app:
#   a) l'elenco «Assenze già comunicate» dev'essere VUOTO all'inizio (il flow lo
#      asserisce). Se è rosso lì, l'account ha una comunicazione residua da un
#      giro precedente: annullala e rilancia.
#   b) l'appello di OGGI non dev'essere ancora registrato per quell'alunno. Il
#      modulo propone il giorno corrente e il server rifiuta con 409
#      ASSENZA_GIA_REGISTRATA quando la maestra ha già fatto l'appello: in quel
#      caso il rosso è CORRETTO e non è un difetto.
# Il campo del giorno NON si tocca: è un `<input type="date">` precompilato a
# oggi, e su Android il tap ci apre sopra il selettore nativo di Chrome — come
# Maestro lo guidi non è mai stato misurato, quindi il flow non ci prova.
# Il campo «Motivo» resta VUOTO di proposito: è facoltativo, è testo libero di
# natura sanitaria di un minore, e Maestro scrive nel proprio log tutto ciò che
# digita (`Inputting text: …`). Non si digita ciò che non si vuole su disco.
#
# ⚠️ SU ANDROID I NODI FUORI SCHERMO CI SONO, MA A DIMENSIONE ZERO — ed è la
# ragione degli `scrollUntilVisible` di questo file. MISURATO il 2026-08-07 con
# `adb shell uiautomator dump`:
#     text="PROSSIMI APPUNTAMENTI"  bounds="[0,0][0,0]"   (home, sezione finale)
#     text="ASSENZE GIÀ COMUNICATE" bounds="[0,0][0,0]"   (/parent/attendance)
#     …e la stessa, dopo uno swipe:  bounds="[105,1257][976,1336]"
# Maestro 2.6.1 non considera visibile un nodo di dimensione zero, quindi su quei
# testi un `assertVisible` fallisce SEMPRE e un `assertNotVisible` passa SEMPRE.
# Le due facce si tengono insieme e sono la stessa causa.
# ⚠️ E NON È COME SU iOS: là quei nodi non esistono affatto, perché l'albero della
# WKWebView espone solo il viewport. Stesso rosso, causa diversa — chi scrive un
# flow iOS col modello Android sbaglia, e il collaudo del 2026-08-07 lo ha
# dimostrato su entrambe. Vedi il README, sezione «Le due piattaforme tagliano la
# pagina in due modi diversi».
#
# NB: l'app è una WebView Capacitor che carica l'app web da server.url. I tempi
# di attesa sono generosi di proposito: la prima pagina passa dalla rete.
# Selettori RI-MISURATI sull'albero di accessibilità il 2026-07-31/08-01
# (emulatore KV-play-phone, Android 16, `adb shell uiautomator dump`).
# =============================================================================
appId: it.kidville.app
name: Kidville · Android — percorso genitore
tags:
  - android
  - genitore
env:
  KV_EMAIL: ${MAESTRO_KV_EMAIL_GENITORE}
  KV_PASSWORD: ${MAESTRO_KV_PASSWORD}
---
- launchApp:
    clearState: true

# ── 1. LOGIN ─────────────────────────────────────────────────────────────────
# Card di login: titolo "Benvenuto/a!", campi Email e Password, CTA "Accedi".
- extendedWaitUntil:
    visible: "Accedi al tuo account Kidville"
    timeout: 60000
- assertVisible: "Benvenuto/a!"
- takeScreenshot: /tmp/kv-android-genitore-0-login

- tapOn:
    below: "Email"
- inputText: ${KV_EMAIL}
- hideKeyboard

- tapOn:
    below: "Password"
- inputText: ${KV_PASSWORD}
- hideKeyboard

- tapOn: "Accedi"

# Il primo avvio può mostrare il dialog nativo dei permessi notifiche: chiudilo.
- runFlow:
    when:
      visible: "Non consentire"
    commands:
      - tapOn: "Non consentire"

# ── 1b. L'OFFERTA DEL GESTORE PASSWORD DI GOOGLE ─────────────────────────────
# MISURATO il 2026-08-07 su KV-play-phone — che è proprio l'immagine col Play
# Store, cioè quella dei telefoni veri delle famiglie: subito dopo «Accedi»
# compare `text="Save password to Google Password Manager?"` con
# `text="Not now" bounds="[63,1720][264,1825]"`, ruba il fuoco e fa fallire
# l'asserzione successiva:
#     Tap on "Accedi"... COMPLETED
#     Run flow when "Non consentire" is visible... SKIPPED
#     Assert that "Avvisi" is visible... FAILED
# Il ramo qui sopra copre un solo dialog di sistema (il permesso notifiche) e
# questo passava per un difetto dell'app.
# L'attesa esplicita davanti serve per la stessa ragione di R14 su iOS:
# `runFlow when:` guarda la condizione UNA VOLTA e non aspetta, e fra il tap e
# il dialog passano centinaia di ms. `optional: true` perché il dialog NON
# compare sempre (dipende dall'autofill dell'AVD).
# L'alternativa copre l'AVD in inglese e uno in italiano: l'etichetta è del
# sistema, non nostra, e non la governiamo.
- extendedWaitUntil:
    visible: "Not now|Non ora"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Not now|Non ora"
    commands:
      - tapOn: "Not now|Non ora"

# ── 2. DASHBOARD ─────────────────────────────────────────────────────────────
# Bottom nav del genitore: HOME · DIARIO · AVVISI · CHAT e il quinto tab, quello
# che apre il foglio «tutte le sezioni». È l'unico che non si prende per la
# scritta che si legge a schermo, e il selettore giusto DIPENDE DALLA VERSIONE
# DELLA WEBVIEW. Per questo è alternato — non per prudenza generica.
#
# ⚠️ Su questo tab il flow ha sbagliato DUE volte, in due modi opposti.
#
# (1) Fino al 2026-07-31 cercava «MENU» e non lo trovava. Il quinto tab è
#       <button aria-label={t('ariaMenu')}> <Icon/> <span>{t('tabMenu')}</span> </button>
#     e sulla WebView di allora il nodo arrivava ad Android con
#     content-desc = «Menu · tutte le sezioni»: nel calcolo del nome accessibile
#     (accname, passo 2C) l'`aria-label` prevale sul contenuto. Il commento di
#     allora dava la colpa alla WebView; era una teoria, ed era sbagliata.
#
# (2) Dal 2026-08-02 non regge più nemmeno l'aria-label. MISURATO con
#     `adb shell uiautomator dump` su KV-play-phone (Android 16 / API 36, WebView
#     150.0.7871.181), home genitore, foglio chiuso:
#       text="MENU"  class=android.widget.Button  content-desc=""  [834,1695][1036,1855]
#     Chromium il nome accessibile lo calcola ancora giusto (`getPartialAXTree`:
#     role=button, name preso dall'aria-label, il contenuto «MENU» marcato
#     `superseded`): è cambiato il PONTE verso `AccessibilityNodeInfo`, che per un
#     <button> con aria-label E testo interno visibile ora passa il testo interno
#     come `text` e lascia vuota la content-desc. Sullo stesso APK su KV-api33
#     (WebView 109) il nodo espone ancora la desc.
#     NON è una proprietà di tutti gli aria-label, ed è il punto che tiene insieme
#     le due misure: sulla stessa schermata la campanella resta
#     `content-desc="Notifiche"` con `text` vuoto (misurata oggi a
#     [937,84][1039,186]), come ogni bottone di sola icona. Il discrimine è il
#     TESTO INTERNO VISIBILE, non l'aria-label. I tab 1-4 non c'entrano: sono
#     <Link> senza aria-label, nome accessibile = contenuto.
#
# Da qui il selettore ALTERNATO «Menu · tutte le sezioni|^MENU$», che regge tutte
# e due le esposizioni. Non è un caso di laboratorio: KV-play-phone è l'immagine
# col Play Store, la WebView si aggiorna da sola, e l'ambiente è cambiato sotto ai
# flow senza che nessuno toccasse il repo — cioè quello che succede sui telefoni
# veri delle famiglie, dove le due versioni convivono.
# Le ancore non sono decorazione: col foglio aperto l'albero contiene anche
# «MENSA Menu e ticket pasto», e `^…$` tiene il tap lontano da lì.
# «Menu»/«MENU» NUDI restano vietati dal lock (R4, R8b) e la lista di questo file
# non li reintroduce: da soli sono morti su WebView 109, e col foglio aperto sono
# ambigui — l'occhiello del foglio è un secondo nodo «MENU», misurato oggi a
# [94,375][322,430], TextView non toccabile. Tutti i passi qui sotto lavorano a
# foglio CHIUSO, dove il nodo «MENU» è uno solo.
# La fonte dell'aria-label è messages/it/nav.json → `ariaMenu` (se cambia lì, R5
# diventa rosso).
#
# ⚠️ IL GATE DI PRONTEZZA NON È PIÙ «Prossimi appuntamenti», ed è il difetto
# BLOCCANTE del collaudo del 2026-08-07: la sezione CALENDARIO è l'ULTIMA della
# home, quindi al primo paint sta fuori dalla viewport e Chromium la passa ad
# `AccessibilityNodeInfo` con `bounds="[0,0][0,0]"`. `extendedWaitUntil` scadeva
# sempre, 60 s, e il collaudo mobile Android del ciclo di fatto non è esistito:
#     Assertion is false: "Prossimi appuntamenti" is visible
# Controprova sullo stesso blocco: «NESSUN APPUNTAMENTO IN PROGRAMMA» (identico
# 0×0) FALLISCE, mentre «OGGI A SCUOLA» ([49,1241][328,1291]) passa. La
# correzione precedente aveva sostituito un gate funzionante con uno che non
# poteva passare.
# Il gate è ora il sottotitolo dell'hero, in cima alla pagina. Si scrive
# `.*Ecco le novit.*` perché il nodo porta l'accento e l'emoji finale e i
# selettori Maestro sono FULL-match (dimostrato: «Ecco le novità di oggi»
# FALLISCE, «Ecco le novità di oggi.*» passa).
- extendedWaitUntil:
    visible: ".*Ecco le novit.*"
    timeout: 60000
- assertVisible: "Home"
- assertVisible:
    text: "Menu · tutte le sezioni|^MENU$"
- takeScreenshot: /tmp/kv-android-genitore-1-dashboard

# ── 3. PRESENZE ──────────────────────────────────────────────────────────────
# "Presenze" vive nel foglio Menu; la voce è resa con il sottotitolo univoco
# "Assenze e giustifiche" (selettore robusto rispetto alle voci vicine).
#
# L'arrivo NON si prova più con «Segnala assenza». È il titolo della pagina, ma
# è ANCHE l'azione rapida della home (home.json → azioneAssenza vale
# «Segnala\nassenza», e il nome accessibile appiattisce gli spazi interni):
# se il tap sul foglio non atterra si resta sulla home, dove quel testo c'è già,
# e la tappa risulterebbe superata senza essersi mossi. «Comunica un'assenza
# alla scuola» è il sottotitolo dell'header e vive solo su /parent/attendance.
# La prova NEGATIVA è l'occhiello del foglio, ANCORATO: se è ancora a schermo, il
# foglio non si è chiuso e quindi non si è navigato. Ancorato perché la forma non
# ancorata (`.*Tutte le sezioni.*`) combacerebbe con l'aria-label del quinto tab,
# «Menu · tutte le sezioni», che sta su OGNI pagina — è il difetto bloccante
# trovato sul gemello iOS il 2026-08-07, e qui non c'è solo perché il selettore è
# scritto esatto. Lock: R21.
# Che non sia vacua lo dice l'uso che ne fa già `android-biometria-loop.yaml`
# (18/18 il 2026-08-01), dove l'occhiello del foglio è la prova di partenza dei
# tap sulle voci di quel foglio: sta in CIMA al foglio, quindi dentro il viewport
# ogni volta che il foglio è aperto.
- tapOn:
    text: "Menu · tutte le sezioni|^MENU$"
- extendedWaitUntil:
    visible: "Assenze e giustifiche"
    timeout: 20000
- tapOn: "Assenze e giustifiche"
- extendedWaitUntil:
    visible: "Comunica un.assenza alla scuola"
    timeout: 45000
- assertNotVisible: "Tutte le sezioni"
- takeScreenshot: /tmp/kv-android-genitore-2-presenze

# ── 4. COMUNICA UN'ASSENZA ───────────────────────────────────────────────────
# La funzione riaperta dal ciclo del 2026-08-07. Fino a ieri i flow si fermavano
# al titolo della pagina: collaudavano che una schermata esiste, non che una
# funzione funziona — ed è così che la funzione è rimasta inutilizzabile per
# mesi senza che nessun collaudo lo dicesse.
#
# La forma è `vuoto → pieno → vuoto`, e non è una comodità: è l'unica sequenza
# che non si può soddisfare stando fermi. Ma vale a UNA condizione, che il primo
# giro aveva mancato: che si guardi DOVE l'elenco si vede.
#
# ⚠️ MISURATO il 2026-08-07: senza scroll, `assertVisible "Assenze già
# comunicate"` FALLISCE sempre (nodo a [0,0][0,0]) e `assertNotVisible "Non hai
# comunicato nessuna assenza…"` PASSA sempre, anche a elenco vuoto e senza aver
# comunicato niente — 17/17 COMPLETED di un flow che non aveva fatto nulla. Le
# due facce della stessa causa: un nodo di dimensione zero non è mai «visibile».
# Perciò l'elenco si porta nel viewport PRIMA di guardarlo, in positivo e in
# negativo. `centerElement: true` perché fermarsi appena il nodo entra lo lascia
# sotto la bottom-nav flottante (vedi README, «il nodo coperto»).
#
# Gli apostrofi dei selettori sono scritti come `.` (metacarattere regex): i
# cataloghi usano quello TIPOGRAFICO (U+2019) e un `'` dritto digitato per
# distrazione — o una normalizzazione della WebView — farebbe fallire il flow
# per una ragione che non ha niente a che vedere con l'app.
- assertVisible: "Giorno"
- scrollUntilVisible:
    element:
      text: "Non hai comunicato nessuna assenza per i prossimi giorni."
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Assenze già comunicate"
- assertVisible: "Non hai comunicato nessuna assenza per i prossimi giorni."
# Il modulo sta SOPRA l'elenco: dopo lo scroll la CTA è fuori dal viewport, cioè
# di nuovo a [0,0][0,0]. Si risale prima di toccarla.
- scrollUntilVisible:
    element:
      text: "Comunica assenza"
    direction: UP
    centerElement: true
    timeout: 20000
# `enabled: true` non è prudenza generica: il bottone nasce `disabled` finché
# l'identità del genitore non è risolta (`disabled={!ready || submitting}`).
# Senza, il tap su un bottone disabilitato risulta COMPLETED e non succede
# niente — la stessa forma di bugia che questa revisione sta chiudendo.
- tapOn:
    text: "Comunica assenza"
    enabled: true
# La conferma sostituisce l'intera pagina: il modulo si smonta.
# ⚠️ L'ancora NON è più «Assenza comunicata»: quel titolo è interamente contenuto
# nell'aria-label del bottone ANNULLA di una riga già in elenco («Annulla
# l'assenza comunicata per il {data}»), e con il full-match case-insensitive i
# due nodi sono indistinguibili — sul gemello iOS ha fatto dichiarare COMPLETED
# un invio ancora in volo, 174 ms dopo il tap. Si usa la CTA della conferma, che
# vive solo su quella schermata. Lock: R23.
# Le due asserzioni insieme dicono «sono sulla conferma» E «non sono più sul
# modulo»: la seconda non è vacua, perché quella CTA era visibile un istante fa.
- extendedWaitUntil:
    visible: "Comunica un.altra assenza"
    timeout: 30000
- assertNotVisible: "Comunica assenza"
- takeScreenshot: /tmp/kv-android-genitore-3-assenza-inviata

# ── 5. L'ASSENZA COMPARE NELL'ELENCO, E L'ANNULLAMENTO LA FA SPARIRE ─────────
# «Comunica un'altra assenza» riporta al modulo con l'elenco sotto, già riletto
# dal server dopo l'invio. E l'elenco, di nuovo, sta sotto la piega.
- tapOn:
    text: "Comunica un.altra assenza"
- scrollUntilVisible:
    element:
      text: "Assenze già comunicate"
    direction: DOWN
    centerElement: true
    timeout: 20000
- extendedWaitUntil:
    visible: "Assenze già comunicate"
    timeout: 20000
# Questa è la prova che l'invio è servito a qualcosa, ed è vera SOLO perché
# l'elenco è nel viewport: a scroll zero passerebbe comunque. Lock: R22.
- assertNotVisible: "Non hai comunicato nessuna assenza per i prossimi giorni."
- takeScreenshot: /tmp/kv-android-genitore-4-assenza-in-elenco
# Il bottone della riga porta un `aria-label` PARLANTE (parentServizi.json →
# attendanceAnnullaAria, «Annulla l'assenza comunicata per il …»): per l'accname
# l'aria-label SOSTITUISCE il testo interno, esattamente come sul quinto tab
# della bottom-nav. Ma dal 2026-08-02 la WebView 150 passa ad Android anche il
# testo interno come `text` lasciando vuota la content-desc, quindi qui vale la
# stessa alternativa del tab «Menu»: regge entrambe le esposizioni.
# `enabled: true` per la stessa ragione del submit: i bottoni «Annulla» di TUTTE
# le righe sono disabilitati finché una DELETE è in volo (`disabled={annullando
# !== null}`), e un tap su un nodo disabilitato risulta COMPLETED senza fare
# niente.
- tapOn:
    text: "Annulla l.assenza comunicata per il .*|^ANNULLA$"
    enabled: true
- extendedWaitUntil:
    visible: "Assenza annullata."
    timeout: 20000
# L'elenco torna vuoto: è la PROVA che la riga scritta su `presenze` è stata
# disfatta. Lo scroll ci riporta sulla zona dell'elenco, che nel frattempo si è
# accorciata di una riga.
- scrollUntilVisible:
    element:
      text: "Non hai comunicato nessuna assenza per i prossimi giorni."
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Non hai comunicato nessuna assenza per i prossimi giorni."
- takeScreenshot: /tmp/kv-android-genitore-5-assenza-annullata

# ── 6. COMUNICAZIONI ─────────────────────────────────────────────────────────
# Tab "Avvisi" della bottom nav → pagina Comunicazioni (/parent/avvisi).
#
# ⚠️ QUI IL FLOW HA MENTITO. Fino al 2026-08-07 questa tappa era
#     - tapOn: "Avvisi"
#     - extendedWaitUntil: visible: "Comunicazioni"
# e risultava COMPLETED restando sulla HOME. Le due misure che lo spiegano
# (`uiautomator dump`, foglio Menu CHIUSO):
#     text="COMUNICAZIONI" bounds="[0,0][0,0]"
#     text="AVVISI"        bounds="[0,0][0,0]"
#     text="COMUNICAZIONI" bounds="[0,0][0,0]"
#     text="AVVISI"        bounds="[506,1803][572,1834]"
# Maestro prende la PRIMA corrispondenza per testo: il tap finiva sul nodo a
# dimensione zero, cioè nell'angolo (0,0), e l'assert successivo trovava
# «Comunicazioni» su un altro nodo fantasma della home. Controprova che il tab è
# sano: `adb shell input tap 539 1818` apre la pagina.
#
# Tre difese, e servono tutte e tre:
#  1. `width/height/tolerance` sul tap — un nodo 0×0 non può più corrispondere.
#     I numeri vengono dal dump di sopra (66×31 su KV-play-phone): sono
#     MISURATI, non stimati, e valgono per quel dispositivo. Se cambia densità o
#     scala del testo il tap fallisce RUMOROSAMENTE, che è il punto.
#  2. prova POSITIVA su un testo che esiste SOLO su /parent/avvisi.
#     ⚠️ NON è più il footer «Le prese visione vengono registrate
#     automaticamente.»: quella prova NON POTEVA passare, per due ragioni
#     indipendenti misurate il 2026-08-07. (a) È in fondo alla pagina →
#     `bounds="[0,0][0,0]"`. (b) `footerRiga1` e `footerRiga2` sono rese nello
#     STESSO paragrafo separate da <br/>, quindi il nodo porta il testo UNITO
#     («📋 Gli avvisi restano visibili fino alla loro scadenza.\nLe prese visione
#     vengono registrate automaticamente.») e il full-match sulla sola seconda
#     riga fallirebbe anche in viewport. Il tap atterrava davvero e l'asserzione
#     accusava l'app.
#     Ora è il SOTTOTITOLO dell'intestazione, in cima alla pagina. Ha tre facce a
#     seconda dei dati (avvisi.json → sottotitoloDaGestire · sottotitoloOk ·
#     sottotitoloCaricamento) e vanno coperte tutte, altrimenti il flow è rosso
#     nei giorni in cui non c'è niente da gestire. «Comunicazioni» e «Avvisi»
#     restano inutilizzabili: sono ambigui con la home (lock R16).
#  3. prova NEGATIVA sulla home. È la difesa che conta — ma quella di ieri era
#     VACUA: «Prossimi appuntamenti» sulla home non è mai «visibile» (0×0),
#     quindi l'`assertNotVisible` passava STANDO sulla home (misurato: 17/17
#     COMPLETED). Ora è l'hero, che sta in cima e nel viewport c'è davvero: se il
#     tap non atterra, questa asserzione FALLISCE. Lock: R17, R22.
- tapOn:
    text: "^AVVISI$"
    width: 66
    height: 31
    tolerance: 25
- extendedWaitUntil:
    visible: ".*avvis[oi] da gestire|Tutto in regola.*|Comunicazioni dalla scuola"
    timeout: 45000
- assertNotVisible: ".*Ecco le novit.*"
- takeScreenshot: /tmp/kv-android-genitore-6-avvisi

# ── 7. TASTO INDIETRO DI ANDROID ─────────────────────────────────────────────
# Deve tornare indietro DENTRO l'app, non chiuderla al primo tap.
#
# Anche questa tappa mentiva: asseriva `visible: "Home"`, che è l'etichetta del
# PRIMO TAB della bottom-nav ed è quindi a schermo su qualunque pagina. Con il
# `back` che non muoveva niente (vedi tappa 6) collaudava un ritorno dalla home
# alla home. Ora si torna da /parent/avvisi a /parent/attendance, e lo si prova
# con i testi delle due pagine: quello che deve esserci e quello che non deve.
