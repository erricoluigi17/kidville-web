name: DB migrate (prod) — verifica a mano, NON applica

# ─────────────────────────────────────────────────────────────────────────────
# DISARMATO IL 2026-10-05 — roadmap di robustezza, fase 1 (problema D7).
#
# COSA ERA. Un workflow che partiva da solo a ogni push su `main` che toccava
# `supabase/migrations/**` e, appena qualcuno approvava l'ambiente `production`,
# lanciava `supabase db push` contro il database di produzione, con la CLI
# `latest` e senza dry-run.
#
# PERCHÉ NON SERVIVA PIÙ, E PERCHÉ ERA PERICOLOSO LASCIARLO.
#   · La strada delle migrazioni è UNA SOLA: l'integrazione GitHub di Supabase
#     («Deploy to production»), che al merge applica i file di
#     `supabase/migrations/**` registrando la version del FILE. Questo workflow
#     arrivava sempre dopo, a cose fatte.
#   · Misurato il 2026-10-05 sul registro dei giri: 72 dal 2026-07-04, di cui 18
#     riusciti, 13 falliti, 40 annullati dal giro successivo e 1 ancora in
#     attesa. I giri approvati il 30/09 e il 02/10 hanno stampato soltanto
#     «Remote database is up to date»: giri a vuoto.
#   · Ma un giro a vuoto non è un giro innocuo. Se l'integrazione ritardasse o
#     fallisse, la stessa approvazione avrebbe applicato DAVVERO le migrazioni
#     pendenti — con una CLI che nessuno aveva scelto e senza aver prima
#     guardato cosa c'era da applicare — su un database che contiene dati reali
#     di minori. Una richiesta di approvazione che resta in attesa per giorni è
#     un pulsante armato.
#
# COSA RESTA. Un solo lancio, a mano (`workflow_dispatch`): `supabase db push
# --dry-run`, che elenca le migrazioni che mancherebbero in produzione e NON ne
# applica nessuna. Serve a rispondere a «il database è allineato ai file del
# repo?» dopo un merge che tocca le migrazioni. Legge il database di produzione,
# quindi resta dietro l'ambiente `production` (revisore obbligatorio).
#
# LA CLI È FISSATA (2.109.0, rilasciata il 2026-06-30, la stessa in uso a mano):
# una versione nuova può cambiare il comportamento di `db push`, e con `latest` il
# comportamento di un giro dipendeva dal giorno in cui partiva.
#
# NON RIARMARLO. Il lock `__tests__/architecture/migrate-yml-non-applica-da-solo.test.ts`
# fallisce se qui ricompare un trigger automatico, un `db push` senza `--dry-run`
# o una CLI non fissata. Per applicare una migrazione si usa l'integrazione:
# vedi `docs/cicd.md`.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}

# Due verifiche non si pestano: la seconda aspetta la prima.
concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  verifica:
    name: supabase db push --dry-run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Elenca le migrazioni che mancano in produzione (non ne applica nessuna)
        run: supabase db push --dry-run --db-url "${{ secrets.PROD_SUPABASE_DB_URL }}"
